name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      actions: write

  build-and-release:
    name: Build & Publish Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev pkg-config cmake

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check tag matches Cargo version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="shell") | .version')
          [ "v$ver" = "$TAG" ] || { echo "tag $TAG != Cargo version $ver"; exit 1; }

      - name: Set up mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Build binary
        run: cargo build --release -p shell
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold

      - name: Package release artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p staging
          cp target/release/cork staging/cork
          cp LICENSE staging/
          tar -czvf "cork-$TAG-linux-x86_64.tar.gz" -C staging .
          sha256sum "cork-$TAG-linux-x86_64.tar.gz" > "cork-$TAG-linux-x86_64.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            title="Pre-release $TAG"
            flags=(--prerelease)
          else
            title="Release $TAG"
            flags=(--latest)
          fi
          gh release create "$TAG" \
            "cork-$TAG-linux-x86_64.tar.gz" \
            "cork-$TAG-linux-x86_64.tar.gz.sha256" \
            --title "$title" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
