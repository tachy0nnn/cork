name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  nix:
    name: Nix Checks (fmt, clippy, build, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Check flake.lock health
        uses: DeterminateSystems/flake-checker-action@main

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # only creates a new cache when nix files or cargo.lock change
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}
          # falls back to the previous nix cache when dependencies update
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # caps the nix store at 4 GB before saving
          gc-max-store-size-linux: 4G
          # automatically deletes all older nix-Linux-* caches!! >,<
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Run flake checks
        run: nix flake check --print-build-logs

  nightly:
    name: Nightly Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev pkg-config cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Build binary
        run: cargo build --release -p shell
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold

      - name: Upload Test Binary
        uses: actions/upload-artifact@v7
        with:
          name: cork-dev-linux-x86_64
          path: target/release/cork # frick YOU
          if-no-files-found: error
          retention-days: 7
