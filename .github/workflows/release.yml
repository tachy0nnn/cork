name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: write

  build-and-release:
    name: Build & Publish Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev pkg-config cmake

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check tag matches Cargo version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="shell") | .version')
          [ "v$ver" = "$TAG" ] || { echo "tag $TAG != Cargo version $ver"; exit 1; }

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cork-cargo"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build binary
        run: cargo build --release -p shell
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold

      - name: Package release artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p staging
          cp target/release/cork staging/cork
          cp LICENSE staging/
          tar -czvf "cork-$TAG-linux-x86_64.tar.gz" -C staging .
          sha256sum "cork-$TAG-linux-x86_64.tar.gz" > "cork-$TAG-linux-x86_64.tar.gz.sha256"

      - name: Determine Release Type
        id: release_type
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_name=Pre-release $TAG" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_name=Release $TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release_type.outputs.release_name }}
          files: |
            cork-${{ github.ref_name }}-linux-x86_64.tar.gz
            cork-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.release_type.outputs.is_prerelease != 'true' }}
          generate_release_notes: true
